<!DOCTYPE html>
<html>
<head>
    <title>Phishing Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1>🔍 Phishing Detector</h1>

    <form method="POST">
        <textarea name="message" rows="5" placeholder="Paste email or message here..."></textarea>
        <button type="submit">Check</button>
    </form>

    <!--  empty input error -->
    {% if error %}
        <div class="result phishing">{{ error }}</div>
    {% endif %}

    {% if result %}
        <div class="result {% if 'Safe' in result %}safe{% else %}phishing{% endif %}">
            {{ result }}
            {% if confidence %}
                <span class="confidence">— {{ confidence }}% confidence</span>
            {% endif %}
        </div>

        {% if reasons %}
            <div class="reasons">
                <strong>Why flagged:</strong>
                <ul>
                    {% for r in reasons %}
                        <li>{{ r }}</li>
                    {% endfor %}
                </ul>
            </div>
        {% endif %}
    {% endif %}
</div>
</body>
</html> <!--  closing tag -->
